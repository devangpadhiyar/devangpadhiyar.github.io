<a class="skip" href="#main">Skip to content</a>
<div id="nav-sentinel" aria-hidden="true"></div>
<header class="nav" id="site-header">
  <div class="nav__in">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__prompt">~</span>devang<span class="brand__caret">_</span>
    </a>

    <button class="nav__toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span>
    </button>

    <nav class="nav__links" id="site-nav" aria-label="Main">
      {%- for item in site.data.nav -%}
        {%- if item.url == '/blog/' and site.posts.size == 0 %}{% continue %}{% endif -%}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
      <a href="{{ site.resume_url | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" target="_blank" rel="noopener">Résumé</a>
      <button class="theme" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
