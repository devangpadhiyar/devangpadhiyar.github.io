# Homepage film: one idea per full-screen scene, in scroll order. Figures come straight from the résumé (v18).
# kind: statement (headline + one sentence) or metric (one big number). no/take/slate are chalked onto the
# 3D clapperboard; `pose` places it (side / back / hide / wrap). A metric with no `source` does not render.
scenes:
  - key: agents
    kind: statement
    no: "01"
    take: 1
    slate: AGENTS
    pose: side
    kicker: "Scene 01 · LLM agents"
    title: "Agents in production"
    body: "I built VideoPilot, Simplified's video-creation agent, on LangGraph and LangChain Deep Agents: 20+ agent skills, sandboxed runs, an offline eval harness."
  - key: latency
    kind: metric
    no: "01"
    take: 2
    slate: LATENCY
    pose: metric
    kicker: "Scene 01 · Take 2 · Agent latency"
    figure: "295 → 69 ms"
    label: "p95 inter-event streaming latency of production agents."
    source: self
    facts:
      - {figure: "698 → 74 ms", label: "time to first event", source: self}
      - {figure: "−77%", label: "p95 latency, same agents", source: self}
      - {figure: "20+", label: "agent skills in VideoPilot", source: self}
  - key: video
