{%- assign p = include.post -%}
<li class="post-card" data-search="{{ p.title | downcase }} {{ p.tags | join: ' ' | downcase }}" data-tags="{{ p.tags | join: ',' | downcase }}">
  <a href="{{ p.url | relative_url }}">
    <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%b %Y" }}</time>
    <h3>{{ p.title }}</h3>
    {%- if p.description %}<p>{{ p.description | strip_html | truncate: 130 }}</p>{% endif -%}
    {%- if p.tags.size > 0 %}<span class="post-card__tags">{% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}</span>{% endif -%}
  </a>
</li>
