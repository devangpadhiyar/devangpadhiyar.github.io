# Flagship: own open-source project
flagship:
  name: langrove
  repo: devangpadhiyar/langrove
  url: https://github.com/devangpadhiyar/langrove
  license: MIT
  language: Python
  tagline: Self-hosted, drop-in alternative to LangGraph Cloud deployments.
  hook: "langgraph_sdk.get_client() works unmodified"
  scale: "183 files · 80 Python modules · FastAPI + Postgres + Redis"
  features:
    - SSE streaming
    - background runs w/ DLQ
    - Postgres checkpointing
    - cross-thread store
    - cron scheduling
    - interrupt / resume
    - multitask strategies
    - pluggable auth
    - Agent Protocol
  # you-vs-them capability facts, stated neutrally
  comparison:
    - feature: Self-hosted
      them: false
      us: true
    - feature: Requires LangSmith
      them: true
      us: false
    - feature: langgraph_sdk compatible
      them: true
      us: true
    - feature: useStream() / Agent Chat UI
      them: true
      us: true
    - feature: Open source (MIT)
      them: false
      us: true

