<div class="skills">
  {%- for tier in site.data.skills -%}
  <section class="tier">
    <h3 class="tier__h">{{ tier.tier }}</h3>
    {%- if tier.note %}<p class="tier__note">{{ tier.note }}</p>{% endif -%}
    <ul class="tier__grid">
      {%- for s in tier.items -%}
      <li class="tier__item" style="--i:{{ forloop.index0 }}"{% if s.artifact %} title="{{ s.name }} — {{ s.artifact }}"{% endif %}>
        <img src="{{ s.icon | relative_url }}" alt="" width="40" height="40" loading="lazy" decoding="async">
        <span>{{ s.name }}</span>
      </li>
      {%- endfor -%}
    </ul>
  </section>
  {%- endfor -%}
</div>
