{%- if site.posts.size == 0 %}<p class="empty">No posts yet.</p>{% else %}
<div class="blog-filter">
  <label class="sr-only" for="post-search">Filter posts</label>
  <input type="search" id="post-search" placeholder="Filter posts…" autocomplete="off">
</div>
<ul class="post-list" id="post-list">
  {%- for post in site.posts -%}{% include post-card.html post=post %}{%- endfor -%}
</ul>
<p class="empty" id="post-empty" hidden>No posts match that filter.</p>
{%- endif %}
