<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "{{ site.author.name }}",
      "url": "{{ site.url }}",
      "image": "{{ site.author.image | absolute_url }}",
      "email": "mailto:{{ site.author.email }}",
      "jobTitle": ["Senior Software Engineer", "Founding Engineer"],
      "address": { "@type": "PostalAddress", "addressLocality": "Ahmedabad", "addressCountry": "IN" },
      "worksFor": { "@type": "Organization", "name": "Simplified", "url": "https://simplified.com" },
      "memberOf": { "@type": "Organization", "name": "Scenes AI", "url": "https://usescenes.com" },
      "alumniOf": { "@type": "CollegeOrUniversity", "name": "LD College of Engineering, Ahmedabad" },
      "knowsLanguage": ["en", "hi", "gu"],
      "sameAs": [
        "https://github.com/{{ site.author.github }}",
        "https://www.linkedin.com/in/{{ site.author.linkedin }}",
        "https://stackoverflow.com/users/{{ site.author.stackoverflow }}",
        "https://x.com/{{ site.author.twitter }}"
      ],
      "knowsAbout": [
        "Large Language Models","LangGraph","Mastra","LangChain","CopilotKit",
        "Model Context Protocol","Agent Orchestration","Durable Execution",
        "Distributed Tracing","Agentic Pipelines","Prompt Engineering","LLMOps",
        "Python","TypeScript","Django","FastAPI","React","FFmpeg","PostgreSQL",
        "Redis","Video Generation","Multi-Agent Systems","AWS","GCP","Azure"
      ]
    }
    {%- if page.url == '/' -%},
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines | strip }}",
      "publisher": { "@id": "{{ site.url }}/#person" }
    }
    {%- endif -%}
    {%- if page.layout == 'post' -%},
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "author": { "@id": "{{ site.url }}/#person" },
      "mainEntityOfPage": "{{ page.url | absolute_url }}",
      "wordCount": {{ content | number_of_words }},
      "keywords": {{ page.tags | join: ', ' | jsonify }},
      "image": "{{ page.image | default: site.author.image | absolute_url }}"
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{ site.url }}/blog/" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
      ]
    }
    {%- endif -%}
    {%- if page.layout == 'project' -%},
    {
      {%- if page.repo -%}
      "@type": "SoftwareSourceCode",
      "codeRepository": "{{ page.repo }}",
      "programmingLanguage": "{{ page.language | default: 'Python' }}",
      "license": "https://spdx.org/licenses/{{ page.license | default: 'MIT' }}.html",
      {%- else -%}
      "@type": "CreativeWork",
      {%- endif -%}
      "name": {{ page.name | default: page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "keywords": {{ page.tools | join: ', ' | jsonify }},
      "author": { "@id": "{{ site.url }}/#person" },
      "url": "{{ page.url | absolute_url }}"
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" },
        { "@type": "ListItem", "position": 2, "name": "Projects", "item": "{{ site.url }}/projects/" },
        { "@type": "ListItem", "position": 3, "name": {{ page.name | default: page.title | jsonify }} }
      ]
    }
    {%- endif -%}
    {%- if page.url contains '/about' -%},
    { "@type": "ProfilePage", "mainEntity": { "@id": "{{ site.url }}/#person" } }
    {%- endif -%}
  ]
}
</script>
