<head>

  {% assign title = page.title | default: page.name | default: site.title | escape %}
  {% assign description = page.description | default: site.description | strip_html | strip_newlines | truncate: 160 %}
  {% assign image = page.image | default: site.author.image %}

  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo title=false %}
  <title>{{ title }}</title>

  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ image | absolute_url }}">

  <link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">

  <!-- Theme style -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

  <!-- Bootstrap CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

  <!-- Animate CSS CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Structured data: Person schema for AI search engines and SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}",
    "image": "{{ site.author.image | absolute_url }}",
    "jobTitle": "Senior Software Engineer",
    "worksFor": {
      "@type": "Organization",
      "name": "Simplified, TLDR Technologies Inc."
    },
    "sameAs": [
      "https://github.com/{{ site.author.github }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin }}",
      "https://stackoverflow.com/users/{{ site.author.stackoverflow }}"
    ],
    "knowsAbout": [
      "Large Language Models",
      "LangGraph",
      "LangChain",
      "CopilotKit",
      "Model Context Protocol",
      "Agent Orchestration",
      "Agentic Pipelines",
      "Agentic Coding",
      "Prompt Engineering",
      "LLMOps",
      "Python",
      "TypeScript",
      "Django",
      "React",
      "FFmpeg",
      "AWS",
      "GCP",
      "Azure"
    ]
  }
  </script>

</head>
